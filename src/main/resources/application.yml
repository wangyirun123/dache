server:
  port: 8081
  servlet:
    context-path: /user

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:db.taxi.local}:${MYSQL_PORT:3306}/taxi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PWD:Admin@123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

# JWT 閰嶇疆
jwt:
  secret: ${JWT_SECRET:taxi-user-service-secret-key-2026}
  expiration: ${JWT_EXPIRATION:86400000} # 1澶╋紝鍗曚綅姣

# Swagger 閰嶇疆
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method